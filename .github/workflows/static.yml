# Deploys cronoslegends.com to GitHub Pages.
#
# Runs on every push to main, once a day (to refresh the LP fee history shown on the site),
# and on demand. Only website files are published: contracts/, monitor/ and other tooling
# are left out of the uploaded artifact.
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # /Images holds the full-size original artwork; pages use the optimised copies in /assets/img.
      # Only the CLG logo is published from /Images, because other sites link to it directly.
      - name: Stage website files
        run: |
          mkdir _site
          rsync -a \
            --include 'Images/' --include 'Images/clg-logo.png' --include 'Images/clg-logo.webp' --exclude 'Images/**' \
            --exclude '.git/' --exclude '.github/' --exclude '_site/' \
            --exclude 'contracts/' --exclude 'monitor/' --exclude 'node_modules/' \
            --exclude '_dev/' --exclude '.claude/' --exclude '.gitignore' --exclude '.gitattributes' \
            --exclude '*.md' --exclude 'scripts/' \
            ./ _site/

      - name: Restore LP history cache
        uses: actions/cache/restore@v6
        with:
          path: .lp-history-cache
          key: lp-history-${{ github.run_id }}
          restore-keys: lp-history-

      # The site still deploys if the RPC is unavailable; the LP widget then hides the history row.
      - name: Build LP fee history
        continue-on-error: true
        run: |
          npm install --prefix monitor --no-audit --no-fund
          node monitor/lp-history.mjs --out _site/assets/data/lp-history.json --cache .lp-history-cache/state.json

      - name: Save LP history cache
        if: always() && hashFiles('.lp-history-cache/state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .lp-history-cache
          key: lp-history-${{ github.run_id }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
